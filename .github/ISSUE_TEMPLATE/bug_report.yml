name: Bug report
description: Report a reproducible problem in a notebook or its setup.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: project
    attributes:
      label: Affected project
      options:
        - Photo analysis
        - Webcam analysis
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the notebook cell and commands, if applicable.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Remove personal data, local paths that reveal sensitive details, and credentials.
      render: text
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and whether CPU or CUDA is used.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed private images and personal data from this report.
          required: true
